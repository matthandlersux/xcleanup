<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3f5c"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="50%" stop-color="#2980b9"/>
      <stop offset="100%" stop-color="#1a5276"/>
    </linearGradient>
    <linearGradient id="lensShine" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.6)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Headset body -->
  <rect x="4" y="18" width="56" height="30" rx="10" ry="10" fill="url(#body)" filter="url(#shadow)"/>
  <!-- Strap hints -->
  <path d="M4 28 Q-2 16 8 10" stroke="#2c2f44" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M60 28 Q66 16 56 10" stroke="#2c2f44" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- Nose cutout -->
  <ellipse cx="32" cy="48" rx="6" ry="4" fill="#0d0d1a"/>
  <!-- Left lens -->
  <circle cx="21" cy="33" r="9" fill="url(#lens)"/>
  <circle cx="21" cy="33" r="9" fill="none" stroke="#5a6080" stroke-width="1"/>
  <ellipse cx="18.5" cy="30" rx="4" ry="3" fill="url(#lensShine)"/>
  <!-- Right lens -->
  <circle cx="43" cy="33" r="9" fill="url(#lens)"/>
  <circle cx="43" cy="33" r="9" fill="none" stroke="#5a6080" stroke-width="1"/>
  <ellipse cx="40.5" cy="30" rx="4" ry="3" fill="url(#lensShine)"/>
  <!-- Top gloss strip -->
  <rect x="4" y="18" width="56" height="12" rx="10" ry="10" fill="url(#shine)"/>
</svg>

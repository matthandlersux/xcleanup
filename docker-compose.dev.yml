name: xcleanup-dev

services:
  app:
    build: .
    ports:
      # This machine only — never 0.0.0.0 or the LAN IP (Docker bypasses UFW). The phone reaches it through
      # Tailscale: `tailscale serve --bg 3002` (tailnet devices only, HTTPS on the machine's ts.net name).
      - "127.0.0.1:3002:3002"
    volumes:
      - ./:/app
      - /app/backend/tmp
      - /app/frontend/node_modules
      - ./data:/data
      - /mnt/krumbus:/mnt/krumbus
      # Other drives: read-only, the overview only reads their sizes
      - /mnt/gimble:/mnt/gimble:ro
      - /mnt/xerxes:/mnt/xerxes:ro
      - /mnt/backup:/mnt/backup:ro
      - /mnt/teebs:/mnt/teebs:ro
      - ${HOME}/.local/share/vlc/ml.xspf:/vlc/ml.xspf:ro
      # One-time migration sources (read-only — never mutated by xcleanup):
      - ${HOME}/Documents/code/vr-file-manager:/vr-source:ro
    env_file:
      - .env
    environment:
      - PORT=8080
      - VITE_PORT=3002
